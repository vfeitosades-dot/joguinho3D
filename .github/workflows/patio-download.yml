name: Publicar executável Pátio
on:
  push:
    branches: [download-patio-v0.2]
    paths: [.github/workflows/patio-download.yml]
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir e publicar o jogo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          unzip -o Patio-Windows.zip Patio.exe
          echo 'c48a35e5ce299f203e184aad1117ff13c2d79c70605b730357c7e38386661879  Patio.exe' | sha256sum -c -
          gh release create patio-windows-0.2 Patio.exe --target "$GITHUB_SHA" --title 'Pátio 0.2 para Windows' --notes 'Novo repouso original e transições de passada sincronizadas. Baixe Patio.exe para jogar.' --latest=false
