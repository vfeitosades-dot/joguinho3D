name: Publicar executável Pátio
on:
  push:
    branches: [download-patio-v0.3]
    paths: [.github/workflows/patio-download.yml]
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir e publicar o jogo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          unzip -o Patio-Windows.zip Patio.exe
          echo '63ea6eee55931b944e82c73591243be95f9f9118ee82520cfade917cc0e31eab  Patio.exe' | sha256sum -c -
          gh release create patio-windows-0.3 Patio.exe Patio-Godot.zip --target "$GITHUB_SHA" --title 'Pátio 0.3 para Windows' --notes 'Caminhada com balanço de braços revisado. Baixe Patio.exe para jogar.' --latest=false
