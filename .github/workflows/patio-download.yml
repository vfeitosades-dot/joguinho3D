name: Publicar executável Pátio
on:
  push:
    branches: [download-patio-v0.4]
    paths: [.github/workflows/patio-download.yml]
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir e publicar o jogo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          unzip -o Patio-Windows.zip Patio.exe
          echo 'df9f2b7540377ae78d4714d2fdfe6ff3ef520b3034101f3a38241ab4fed1c49a  Patio.exe' | sha256sum -c -
          gh release create patio-windows-0.4 Patio.exe Patio-Godot.zip --target "$GITHUB_SHA" --title 'Pátio 0.4 para Windows' --notes 'Corrida com ombros e cotovelos corrigidos e mais espaço entre as mãos e as coxas ao caminhar. Baixe Patio.exe para jogar.' --latest=false
