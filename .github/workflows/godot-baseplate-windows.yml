name: Godot Baseplate - Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'GODOT_BASEPLATE/**'
      - '.github/workflows/godot-baseplate-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-windows:
    name: Compilar BaseplateGodot.exe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Godot 4.4.1 e templates Windows
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Importar projeto e validar scripts
        run: |
          godot --version
          godot --headless --path GODOT_BASEPLATE --editor --quit

      - name: Exportar executavel Windows 64 bits
        run: |
          mkdir -p build/windows
          godot --headless --path GODOT_BASEPLATE --export-release "Windows Desktop" "$GITHUB_WORKSPACE/build/windows/BaseplateGodot.exe"
          test -s build/windows/BaseplateGodot.exe

      - name: Publicar EXE para baixar
        uses: actions/upload-artifact@v4
        with:
          name: Godot-Baseplate-Windows-EXE
          path: build/windows/
          if-no-files-found: error
          retention-days: 30

      - name: Publicar EXE em Release com link direto
        uses: softprops/action-gh-release@v2
        with:
          tag_name: baseplate-godot-latest
          target_commitish: main
          name: "Baseplate Godot - Windows 64 bits"
          body: |
            Executável Windows 64 bits do Baseplate 3D adaptado para a Godot.
            Download direto: BaseplateGodot.exe
            Controles: WASD/setas, mouse, espaço, Esc.
            Build gerado automaticamente pelo GitHub Actions.
          files: build/windows/BaseplateGodot.exe
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: false
