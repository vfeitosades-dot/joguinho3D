name: Unity - Bloco Quest Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar credenciais da Unity
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Configure UNITY_LICENSE, UNITY_EMAIL e UNITY_PASSWORD em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Compilar para Windows 64 bits
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: UNITY_MINIJOGO_3D
          unityVersion: 2022.3.62f1
          targetPlatform: StandaloneWindows64
          buildMethod: BlocoQuest.Editor.SceneBuilder.BuildWindows
          buildsPath: build

      - name: Publicar executavel e dados
        uses: actions/upload-artifact@v4
        with:
          name: BlocoQuest-Windows64
          path: build/StandaloneWindows64/
          if-no-files-found: error
