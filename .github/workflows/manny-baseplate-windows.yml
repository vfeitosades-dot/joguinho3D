name: Manny Baseplate - Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'MANNY_BUILD/**'
      - '.github/workflows/manny-baseplate-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manny-baseplate-release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar modelo e criar animacoes
        run: |
          python -m pip install numpy scipy pillow
          python MANNY_BUILD/prepare.py
          python MANNY_BUILD/garage.py
      - name: Instalar Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Validar carregamento e nove animacoes e garagem
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path GODOT_BASEPLATE --editor --quit
          godot --headless --path GODOT_BASEPLATE --quit-after 3600 -- --garage-test 2>&1 | tee /tmp/manny-test.log
          grep -F 'MANNY_READY: 9 clips' /tmp/manny-test.log
          grep -F 'GARAGE_READY: 7 cars' /tmp/manny-test.log
          grep -F 'GARAGE_TEST_OK' /tmp/manny-test.log
          grep -F 'DOORS_TEST_OK' /tmp/manny-test.log
          grep -F 'WALL_TOUCH_TEST_OK' /tmp/manny-test.log
      - name: Validar renderizador OpenGL com tela virtual
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "3.3"
        run: |
          set -o pipefail
          xvfb-run -a godot --path GODOT_BASEPLATE --rendering-method gl_compatibility --audio-driver Dummy --quit-after 3600 -- --garage-test 2>&1 | tee /tmp/manny-graphics.log
          grep -F 'WALL_TOUCH_TEST_OK' /tmp/manny-graphics.log
      - name: Compilar para Windows
        run: |
          mkdir -p build/manny
          godot --headless --path GODOT_BASEPLATE --export-release "Windows Desktop" "$GITHUB_WORKSPACE/build/manny/Baseplate_Manny.exe"
          test -s build/manny/Baseplate_Manny.exe
          cp GODOT_BASEPLATE/CREDITS.txt build/manny/CREDITS.txt
          printf '@echo off\r\ncd /d "%%~dp0"\r\nBaseplate_Manny.exe --rendering-method gl_compatibility --rendering-driver opengl3 --log-file "motorlab-log.txt"\r\npause\r\n' > build/manny/Diagnostico.bat
      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Baseplate-Manny-Windows
          path: build/manny/
          if-no-files-found: error
  verify-windows:
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Baseplate-Manny-Windows
          path: build/manny
      - name: Validar executavel Windows exportado
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path "build/manny/Baseplate_Manny.exe") -ArgumentList @("--headless","--log-file","motorlab-test.log","--quit-after","3600","--","--garage-test") -Wait -PassThru
          Get-Content motorlab-test.log
          if ($p.ExitCode -ne 0) { throw "EXE exit code $($p.ExitCode)" }
          foreach ($marker in @("MANNY_READY: 9 clips","GARAGE_READY: 7 cars","GARAGE_TEST_OK","DOORS_TEST_OK","WALL_TOUCH_TEST_OK")) {
            if (-not (Select-String -Path motorlab-test.log -SimpleMatch $marker -Quiet)) { throw "Missing $marker" }
          }
      - name: Publicar download direto
        uses: softprops/action-gh-release@v2
        with:
          tag_name: baseplate-manny-v7-studio
          name: "Motor Lab V7 - Studio"
          body: |
            Menu, tela cheia, resolucao HD e Full HD, duas maos na parede lateral e porta do motorista articulada (extracao aproximada da malha).
            Sete carros, nove animacoes do Manny e interacao ambiental com parede.
            Testes de renderizacao OpenGL em Linux e executavel Windows headless.
            Desempenho em Intel HD depende de driver e hardware; consulte CREDITS.txt.
          files: |
            build/manny/Baseplate_Manny.exe
            build/manny/CREDITS.txt
            build/manny/Diagnostico.bat
          fail_on_unmatched_files: true
          make_latest: false
