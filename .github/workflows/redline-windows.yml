name: REDLINE - Windows EXE
on:
  workflow_dispatch:
  push:
    paths:
      - 'SEDAN_REDLINE_GODOT/**'
      - '.github/workflows/redline-windows.yml'

jobs:
  build-windows:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot and templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.2
          use-dotnet: false
          include-templates: true
      - name: Import assets and validate scripts
        run: godot --headless --path SEDAN_REDLINE_GODOT --editor --quit
      - name: Export REDLINE Windows 64-bit
        run: |
          mkdir -p SEDAN_REDLINE_GODOT/build
          godot --headless --path SEDAN_REDLINE_GODOT --export-release "Windows Desktop" build/REDLINE.exe
          test -s SEDAN_REDLINE_GODOT/build/REDLINE.exe
      - name: Upload executable as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: REDLINE-Windows
          path: SEDAN_REDLINE_GODOT/build/REDLINE.exe
          if-no-files-found: error
      - name: Publish EXE to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: redline-v1.0.0
          name: REDLINE VORTEX S4 - Windows
          body: |
            Download REDLINE.exe para jogar no Windows 64 bits.
            Jogo de demonstração 3D Godot, com sedã low-poly, baseplate, reflexos, vidro, animações e minijogo fictício de partida.
          files: SEDAN_REDLINE_GODOT/build/REDLINE.exe
          fail_on_unmatched_files: true
